# MinIO S3 Extension Configuration (Gaia-X Implementation)
# Note: These properties are for the new MinIO S3 extension that replaces AWS S3 extensions
fr.gxfs.s3.access.key=minioadmin
fr.gxfs.s3.secret.key=minioadmin
fr.gxfs.s3.endpoint=http://localhost:9000

# AWS S3 (type "AmazonS3") push secured with temporary STS credentials.
# Custom provisioner: eu.europa.ec.simpl.provision.s3.S3StsProvisionExtension.
#
# Credentials: edc.aws.access.key / edc.aws.secret.access.key are VAULT KEY NAMES, not literal
# secrets. Leaving them UNSET makes EDC use the AWS DefaultCredentialsProvider, i.e. the connector's
# ambient identity: environment variables (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION),
# the EKS node role, or (preferred) an IRSA role. That identity only needs sts:AssumeRole on the role
# below; it never leaves the consumer. On transfer start the consumer assumes the role and only the
# resulting temporary token (accessKey + secretKey + sessionToken + expiration) is handed to the
# provider, which uploads (multipart for large objects) and lets it expire.
#
# Pre-existing IAM role to assume (REQUIRED unless every transfer carries a 'roleArn' property).
# Per-transfer override: the "roleArn" property of the dataDestination.
edc.aws.provision.sts.role.arn=arn:aws:iam::<account-id>:role/ednel-s3-push
# Optional STS externalId, only if the role's trust policy requires one (per-transfer: "externalId").
# edc.aws.provision.sts.external.id=
# Requested STS session duration (seconds). Must be <= the role's MaxSessionDuration and should
# exceed the longest expected transfer (large multipart uploads included). Default 3600.
edc.aws.provision.role.duration.session.max=3600
#
# region, bucketName, objectName (and optional endpointOverride) are chosen per transfer in the
# dataDestination; region is mandatory.

#This flag disable aruba okhttp library and takes okhttp provided by edc. If i want to turn it on i need to set this value
# to OkHttpSimplClient
client.okhttp.type=OkHttpClient

